<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon Popping Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin-top: 10px;
            color: #333;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #videoFeed {
            width: 80%;
            max-width: 640px;
            height: auto;
            margin: 20px auto;  /* Centering the video feed */
        }
        #reset-btn {
            margin-top: 60px;  /* Extra margin to place the button further below the video feed */
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #ff6666;
            color: #fff;
            border: none;
            border-radius: 5px;
        }
        #reset-btn:hover {
            background-color: #ff3333;
        }
    </style>
</head>
<body>

    <h1>Balloon Popping Game</h1>

    <!-- Container for video feed and reset button -->
    <div class="container">
        <!-- Video Feed -->
        <img id="videoFeed" src="{{ url_for('video_feed') }}">

        <!-- Reset Button, further down and centered -->
        <button id="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <script>
        function resetGame() {
            // Redirect to reset route with a slight delay for smooth reset
            setTimeout(() => {
                window.location.href = "{{ url_for('reset') }}";
            }, 100);  // 100ms delay to ensure reset
        }
    </script>

</body>
</html>
